[project]
name = "casmi26"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jiří Jaskowiec", email = "jirijaskowiec@seznam.cz" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "rdkit==2026.3.3",
]

[project.scripts]
casmi26 = "casmi26:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
